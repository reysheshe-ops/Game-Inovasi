<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Chef Hat Base -->
  <g filter="url(#shadow)" transform="translate(56, 40)">
    <!-- Plate base -->
    <circle cx="200" cy="230" r="150" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="12" />
    
    <!-- Pizza Crust and Sauces -->
    <circle cx="200" cy="230" r="125" fill="#E76F51" />
    <circle cx="200" cy="230" r="110" fill="#FFC83B" />
    
    <!-- Fraction cut lines -->
    <!-- 1/4 slice cut highlight -->
    <path d="M 200 230 L 200 120 A 110 110 0 0 1 310 230 Z" fill="#FF70A6" opacity="0.9" />
    
    <!-- Cut divider lines -->
    <line x1="90" y1="230" x2="310" y2="230" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="200" y1="120" x2="200" y2="340" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

    <!-- Pizza toppings (pepperoni & basil) -->
    <circle cx="150" cy="180" r="14" fill="#E63946" />
    <circle cx="160" cy="275" r="14" fill="#E63946" />
    <circle cx="245" cy="285" r="14" fill="#E63946" />
    <circle cx="255" cy="175" r="16" fill="#06D6A0" />

    <!-- Cute Smiling Face on Pizza -->
    <circle cx="170" cy="225" r="6" fill="#4A3000" />
    <circle cx="230" cy="225" r="6" fill="#4A3000" />
    <path d="M 185 242 Q 200 256 215 242" stroke="#4A3000" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="160" cy="235" r="6" fill="#FF85A1" opacity="0.6" />
    <circle cx="240" cy="235" r="6" fill="#FF85A1" opacity="0.6" />

    <!-- Chef Hat on top -->
    <g transform="translate(100, 10)">
      <path d="M 20 60 C 0 35, 10 0, 45 15 C 65 -15, 135 -15, 155 15 C 190 0, 200 35, 180 60 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="6" />
      <rect x="25" y="55" width="150" height="25" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="6" />
      <rect x="40" y="62" width="120" height="8" rx="4" fill="#118AB2" />
    </g>
  </g>

  <!-- Fraction Badge "1/2" -->
  <g transform="translate(340, 360)">
    <circle cx="35" cy="35" r="50" fill="#118AB2" filter="url(#shadow)" />
    <circle cx="35" cy="35" r="42" fill="#06D6A0" />
    <text x="35" y="24" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">1</text>
    <line x1="20" y1="33" x2="50" y2="33" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <text x="35" y="58" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>
</svg>
